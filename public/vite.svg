<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Outer Circle with Animated Glowing Effect -->
  <circle cx="32" cy="32" r="30" fill="#24292e">
    <animate attributeName="r" values="30;33;30" dur="2s" keyTimes="0;0.5;1" repeatCount="indefinite"/>
  </circle>

  <!-- Lock Shape with a Modern Design -->
  <path d="M24 28 v-4 a8 8 0 0 1 16 0 v4 h-4 v-4 a4 4 0 0 0-8 0 v4 h-4 z" fill="#fff" />
  
  <!-- Lock Body with Rounded Corners -->
  <rect x="20" y="28" width="24" height="18" rx="3" fill="#fff" />

  <!-- Keyhole with Animation -->
  <circle cx="32" cy="37" r="3" fill="#24292e" />
  <path d="M32 40 v3" stroke="#24292e" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Subtle Animation Effect -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="2">
    <animateTransform attributeName="transform" type="rotate" values="0 32 32;360 32 32" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Glowing Effect on Lock -->
  <path d="M24 28 v-4 a8 8 0 0 1 16 0 v4 h-4 v-4 a4 4 0 0 0-8 0 v4 h-4 z" fill="none" stroke="#fff" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="1s" keyTimes="0;0.5;1" repeatCount="indefinite"/>
  </path>
</svg>
